<!DOCTYPE html>
<html lang="en">
<head>

<body>
    <h1>UIMS Purchase Portal</h1>

        <p>UIMS Access Key</p>
        <div class="number_of_keys">
            <div class="keys_button">
                <button class="number_modifier" id="minus">-</button>
                <input type="number" name="keys" id="keys" min="1" value="1">
                <button class="number_modifier" id="plus">+</button>

            <div class="cost_of_keys">
                <p>NGN<span class="cost_of_keys_text">10,300</span></p>
            </div>

    </section>
    <form action="" method="post" id="form">
        <fieldset>
            <label for="firstName">
                First Name
                
            </label>
            <input type="text" required name="firstName" id="firstName" placeholder="John">
        </fieldset>
        <fieldset>
            <label for="lastName">
                Last Name
                
            </label>
            <input type="text" required name="lastName" id="lastName" placeholder="Doe">
        </fieldset>
        <fieldset>
            <label for="phoneNumber">
                Phone Number
                
            </label>
            <input type="text" required name="phoneNumber" id="phoneNumber" placeholder="0812345678">
        </fieldset>
        <fieldset>
            <label for="lastName">
                Email Address
                
            </label>
            <input type="email" required name="email" id="email" placeholder="johndoe@gmail.com">
        </fieldset>
        <button id="pay_button">Pay</button>

        <div class="error_message"></div>
    </form>
</body>
</html>
